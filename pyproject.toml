[project]
name = "ai-agents"
version = "0.1.0"
description = "Orchestrator and specialist agents. The example reads the payments and reconciliation replicas."
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk>=1.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=1.9",
  "pydantic>=2.10",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
